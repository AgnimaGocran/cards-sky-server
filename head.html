<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Server — ресурсы и сервисы</title>
<meta name="description" content="VPN, нейросети и сервисы: подключение к VPN через Happ, чаты ИИ, список нейросетей">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b27;
    --border: #262d3f;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #4f8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 32px; letter-spacing: .5px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    justify-content: center;
    width: 100%;
    max-width: 1560px;
  }
  a.tile {
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    text-decoration: none;
    color: var(--text);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  a.tile:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 30px rgba(79, 140, 255, .15);
  }
  .logo { height: 56px; display: flex; align-items: center; }
  .logo .emoji { font-size: 44px; line-height: 56px; }
  .logo img { max-height: 56px; max-width: 180px; width: auto; border-radius: 10px; }
  .tile h2 { font-size: 1.15rem; }
  .tile p { color: var(--muted); font-size: .95rem; line-height: 1.5; }
  .badge { display:inline-block; margin-left:8px; padding:2px 10px; border-radius:999px; background:rgba(79,140,255,.15); color:var(--accent); font-size:.72rem; font-weight:600; vertical-align:middle; text-transform:uppercase; letter-spacing:.4px; }
  .cta { color: var(--accent); font-weight: 600; font-size: .9rem; margin-top: auto; }
</style>
</head>
<body>
  <h1>🚀 Sky Server — ресурсы</h1>
